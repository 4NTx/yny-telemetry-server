version: '3.8'

services:
  telemetry-server:
    build: .
    container_name: yny-telemetry-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CLIENT_TOKEN=${CLIENT_TOKEN:?Defina CLIENT_TOKEN}
      - ADMIN_KEY=${ADMIN_KEY:?Defina ADMIN_KEY}
    volumes:
      - ./data:/app/data
